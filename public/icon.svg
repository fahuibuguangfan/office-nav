<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a7a92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolbox-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7f50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e85d3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handle-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a7a92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a6a82;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightning-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe8cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-gradient)"/>

  <!-- 工具箱主体阴影 -->
  <path d="M 180 280 L 180 420 Q 180 440 200 440 L 512 440 Q 532 440 532 420 L 532 280 Z"
        fill="#2a3a48" opacity="0.3" transform="translate(-100, -80)"/>

  <!-- 工具箱主体 -->
  <rect x="140" y="200" width="232" height="160" rx="16" ry="16"
        fill="url(#toolbox-gradient)" stroke="#2c3e50" stroke-width="6"/>

  <!-- 工具箱底部深色条 -->
  <rect x="140" y="320" width="232" height="40" rx="0" ry="0"
        fill="#d64a2a" opacity="0.6"/>

  <!-- 工具箱细节线条 -->
  <line x1="148" y1="330" x2="364" y2="330" stroke="#c43a1a" stroke-width="2"/>
  <line x1="148" y1="350" x2="364" y2="350" stroke="#c43a1a" stroke-width="2"/>

  <!-- 把手 -->
  <path d="M 200 200 Q 200 160 256 160 Q 312 160 312 200"
        fill="none" stroke="url(#handle-gradient)" stroke-width="12" stroke-linecap="round"/>
  <rect x="232" y="155" width="48" height="16" rx="8" ry="8"
        fill="#ff7f50" stroke="#2c3e50" stroke-width="3"/>

  <!-- 把手连接点 -->
  <rect x="195" y="192" width="16" height="20" rx="4" ry="4" fill="#ffab91"/>
  <rect x="301" y="192" width="16" height="20" rx="4" ry="4" fill="#ffab91"/>

  <!-- 工具图标：扳手 -->
  <g transform="translate(170, 230)">
    <path d="M 10 35 L 15 30 L 25 40 L 35 30 Q 40 25 40 15 Q 40 5 30 5 L 25 10 L 20 5 L 10 15 Z"
          fill="#e8f4f8" stroke="#2c3e50" stroke-width="3"/>
  </g>

  <!-- 工具图标：齿轮1 -->
  <g transform="translate(240, 240)">
    <circle cx="0" cy="0" r="12" fill="#4a5568" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#2c3e50"/>
    <rect x="-3" y="-16" width="6" height="8" fill="#4a5568"/>
    <rect x="-3" y="8" width="6" height="8" fill="#4a5568"/>
    <rect x="-16" y="-3" width="8" height="6" fill="#4a5568"/>
    <rect x="8" y="-3" width="8" height="6" fill="#4a5568"/>
  </g>

  <!-- 工具图标：齿轮2 -->
  <g transform="translate(290, 245)">
    <circle cx="0" cy="0" r="10" fill="#ff8c42" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#2c3e50"/>
    <rect x="-2" y="-13" width="4" height="6" fill="#ff8c42"/>
    <rect x="-2" y="7" width="4" height="6" fill="#ff8c42"/>
    <rect x="-13" y="-2" width="6" height="4" fill="#ff8c42"/>
    <rect x="7" y="-2" width="6" height="4" fill="#ff8c42"/>
  </g>

  <!-- 工具图标：文件夹 -->
  <g transform="translate(310, 230)">
    <path d="M 0 10 L 0 35 L 40 35 L 40 10 Z"
          fill="#ffa726" stroke="#2c3e50" stroke-width="2.5"/>
    <path d="M 0 10 L 15 10 L 18 5 L 30 5 L 33 10 L 40 10"
          fill="#ffb74d" stroke="#2c3e50" stroke-width="2.5"/>
  </g>

  <!-- 闪电标志 -->
  <g transform="translate(256, 300)">
    <!-- 闪电外发光 -->
    <path d="M -25 -80 L -10 -20 L -30 -15 L 15 40 L 0 -10 L 20 -15 Z"
          fill="#ffd700" opacity="0.3" filter="blur(4px)"/>

    <!-- 闪电主体 -->
    <path d="M -20 -70 L -8 -18 L -25 -13 L 12 35 L 0 -8 L 17 -13 Z"
          fill="url(#lightning-gradient)" stroke="#ff8c00" stroke-width="4" stroke-linejoin="round"/>

    <!-- 闪电高光 -->
    <path d="M -15 -60 L -10 -30 L -5 -15"
          fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- 工具箱边缘高光 -->
  <path d="M 156 210 Q 156 206 160 206 L 352 206 Q 356 206 356 210"
        fill="none" stroke="#ff9f7f" stroke-width="3" opacity="0.5"/>
</svg>
