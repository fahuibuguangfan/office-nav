name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 构建 CLI 二进制（hs 和 huashun），放入 target/release/ 供 NSIS 打包器复制
      - name: Build CLI binaries
        working-directory: src-tauri
        run: |
          cargo build --release --bin hs --bin huashun
          echo "CLI binaries built successfully"

      - name: Build Tauri app
        # 仅打 tag 触发时发布正式 Release；手动触发（workflow_dispatch）只构建不发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '办公室服务导航 ${{ github.ref_name }}'
          releaseBody: '请在 Assets 中下载对应平台的安装包。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (manual, no release)
        # 手动触发只做构建验证，不发 Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

  # 打包完成后兜底刷新 jsDelivr CDN 缓存
  # app-version.json 通过 @master 浮动分支引用，jsDelivr 会长期缓存浮动引用，
  # 本地脚本 push 后已 purge 一次，这里做 CI 侧保险（GitHub runner 网络稳定）
  purge-cdn:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Purge jsDelivr CDN cache
        run: |
          PURGE_URL="https://purge.jsdelivr.net/gh/fahuibuguangfan/office-nav@master/public/app-version.json"
          echo "Purging: $PURGE_URL"
          curl -s --fail --max-time 30 "$PURGE_URL" && echo "✅ CDN purged" || echo "⚠️ purge failed (non-fatal)"
